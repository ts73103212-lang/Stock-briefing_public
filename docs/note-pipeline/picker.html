<title>noteネタ選び</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* レイアウト：1列のカード一覧＋自由記述枠＋画面下に固定の確定バー。スマホで片手で選べることを優先 */
:root{
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#18202C; --muted:#5C6676; --line:#DCE1E8;
  --navy:#1E3A5F; --gold:#C8961E; --gold-soft:#FBF2DC; --pick:#1E3A5F; --pick-soft:#E6EEF8;
  --long:#7E1A2C; --long-soft:#F8E9EC;
  --ok:#13803B; --warn:#B45309; --ng:#B91C1C;
  --f:"Meiryo UI","メイリオ",Meiryo,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --card:#18202B; --ink:#E7ECF3; --muted:#9AA6B6; --line:#2A3443;
  --navy:#8FB4E3; --gold:#E2B54A; --gold-soft:#2C2616; --pick:#8FB4E3; --pick-soft:#1C2B3F;
  --long:#E08A9B; --long-soft:#3A1F26;
  --ok:#4ADE80; --warn:#F59E0B; --ng:#F87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --card:#18202B; --ink:#E7ECF3; --muted:#9AA6B6; --line:#2A3443;
  --navy:#8FB4E3; --gold:#E2B54A; --gold-soft:#2C2616; --pick:#8FB4E3; --pick-soft:#1C2B3F;
  --long:#E08A9B; --long-soft:#3A1F26;
  --ok:#4ADE80; --warn:#F59E0B; --ng:#F87171; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-direction:column;gap:10px}
h1{font-size:22px;margin:0;color:var(--navy);text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;font-weight:700;border:1px solid currentColor}
.pill.open{color:var(--ok)} .pill.closed{color:var(--muted)} .pill.done{color:var(--navy)}
h2{font-size:15px;margin:22px 0 8px;color:var(--muted);letter-spacing:.04em}
.grid{display:grid;gap:10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;font:inherit;color:inherit;width:100%;min-width:0}
.card[data-mode="normal"]{border-color:var(--pick);background:var(--pick-soft)}
.card[data-mode="long"]{border-color:var(--long);background:var(--long-soft)}
.mark{grid-row:span 4;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--bg);margin-top:2px}
.card[data-mode="normal"] .mark{background:var(--pick);border-color:var(--pick)}
.card[data-mode="long"] .mark{background:var(--long);border-color:var(--long)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{background:var(--gold-soft);color:var(--ink);border-radius:4px;padding:0 6px;font-weight:700}
.code{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy)}
.title{font-size:16px;font-weight:700;line-height:1.45;min-width:0}
.sum{color:var(--muted);font-size:13.5px;min-width:0}
.modes{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.modes button{font:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:6px 12px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.modes button.n[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--bg)}
.modes button.l[aria-pressed="true"]{background:var(--long);border-color:var(--long);color:var(--bg)}
.modes button:disabled{opacity:.4;cursor:default}
.free{background:var(--card);border:1.5px dashed var(--gold);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.free[data-mode="normal"]{border-style:solid;border-color:var(--pick);background:var(--pick-soft)}
.free[data-mode="long"]{border-style:solid;border-color:var(--long);background:var(--long-soft)}
.free label{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.free input,.free textarea{font:inherit;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);color:var(--ink)}
.free textarea{min-height:88px;resize:vertical}
.free .hint{font-size:12px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .count{font-weight:700;font-size:14px}
.bar .count .l{color:var(--long)}
.bar button{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--navy)}
.btn-main{background:var(--navy);color:var(--bg)} .btn-sub{background:transparent;color:var(--navy)}
.bar button:disabled{opacity:.45;cursor:default}
.msg{font-size:13px;color:var(--muted);flex:1 1 200px;min-width:0}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px;color:var(--muted);text-align:left;margin-top:16px}
.result{background:var(--card);border:1.5px solid var(--navy);border-radius:12px;padding:12px 14px;margin-top:14px}
.result ul{margin:6px 0 0;padding-left:1.3em}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;margin-right:4px;color:var(--bg);background:var(--pick)}
.tag.l{background:var(--long)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>noteネタ選び</h1>
    <p class="sub">平日11:50ごろに候補10本が届きます。16:15までに「通常記事」を1〜3本、「長文（有料）記事」を1本まで選んで確定すると、その分だけ書きます。自由記述の枠も1つあります。選ばなければその日はお休みです。</p>
    <div class="days" id="days" aria-label="日付"></div>
    <div class="status" id="status"></div>
  </header>
  <main id="main">
    <div class="empty" id="loading">候補を読み込んでいます…</div>
  </main>
</div>
<div class="bar" id="bar" hidden>
  <div class="in">
    <span class="count" id="count">通常 0/3・<span class="l">長文 0/1</span></span>
    <button class="btn-main" id="confirm" type="button">この内容で確定</button>
    <button class="btn-sub" id="skip" type="button">今日は書かない</button>
    <span class="msg" id="msg" role="status"></span>
  </div>
</div>

<script>
(function(){
  const DEADLINE = "16:15", MAX_N = 3, MAX_L = 1;
  const $ = (id) => document.getElementById(id);
  let db = null, days = [], current = null, picks = {}, unsubPick = null;
  let sel = [], longId = null, free = {use: false, mode: "normal", title: "", memo: ""};

  function jstNow(){
    const p = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
    const g = (t) => p.find(x => x.type === t).value;
    return {date:`${g("year")}-${g("month")}-${g("day")}`, time:`${g("hour")}:${g("minute")}`.replace(/^24/,"00")};
  }
  function isOpen(day){ const n = jstNow(); return day.date === n.date && n.time < (day.deadline || DEADLINE); }
  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function label(d){ const [y,m,dd] = d.split("-"); const w = "日月火水木金土"[new Date(+y, +m - 1, +dd).getDay()]; return `${+m}/${+dd}（${w}）`; }
  function counts(){
    const n = sel.length + (free.use && free.mode === "normal" ? 1 : 0);
    const l = (longId ? 1 : 0) + (free.use && free.mode === "long" ? 1 : 0);
    return {n, l};
  }
  function loadDraft(date){ try { const d = JSON.parse(localStorage.getItem("free-" + date) || "null"); if (d) free = Object.assign({use:false, mode:"normal", title:"", memo:""}, d); } catch (e) {} }
  function saveDraft(){ try { if (current) localStorage.setItem("free-" + current.date, JSON.stringify(free)); } catch (e) {} }

  function renderDays(){
    const box = $("days"); box.textContent = "";
    days.forEach(d => {
      const b = el("button", null, label(d.date)); b.type = "button";
      b.setAttribute("aria-pressed", String(current && current.date === d.date));
      b.addEventListener("click", () => select(d.date));
      box.appendChild(b);
    });
  }
  function renderStatus(){
    const s = $("status"); s.textContent = "";
    if (!current) return;
    const open = isOpen(current), p = picks[current.date];
    s.appendChild(el("span", open ? "pill open" : "pill closed", open ? `受付中・締切 ${current.deadline || DEADLINE}` : "締切済み"));
    if (p){
      const n = (p.ids || []).length + (p.free && p.free.mode === "normal" ? 1 : 0);
      const l = (p.long ? 1 : 0) + (p.free && p.free.mode === "long" ? 1 : 0);
      s.appendChild(el("span","pill done", n + l ? `確定済み：通常${n}本・長文${l}本` : "今日は書かない（確定済み）"));
    }
  }

  function setMode(id, mode){
    if (!isOpen(current)) return;
    const c = counts();
    const wasN = sel.includes(id), wasL = longId === id;
    sel = sel.filter(x => x !== id); if (longId === id) longId = null;
    if (mode === "normal" && !wasN){
      if (c.n - (wasN ? 1 : 0) >= MAX_N){ $("msg").textContent = "通常記事は3本までです。外してから選んでください。"; render(); return; }
      sel.push(id);
    } else if (mode === "long" && !wasL){
      if (c.l - (wasL ? 1 : 0) >= MAX_L){ $("msg").textContent = "長文記事は1日1本までです。外してから選んでください。"; render(); return; }
      longId = id;
    }
    $("msg").textContent = ""; render();
  }

  function card(c){
    const mode = sel.includes(c.id) ? "normal" : (longId === c.id ? "long" : "");
    const b = el("div","card"); if (mode) b.dataset.mode = mode;
    const mark = el("span","mark", mode === "normal" ? String(sel.indexOf(c.id) + 1) : (mode === "long" ? "長" : ""));
    const meta = el("div","meta");
    meta.appendChild(el("span","chip", c.genre || (c.kind === "stock" ? "個別銘柄" : "話題")));
    if (c.kind === "stock"){ meta.appendChild(el("span","code", `${c.code || ""} ${c.name || ""}`.trim())); if (c.sector) meta.appendChild(el("span",null,c.sector)); }
    const title = el("div","title", c.title || "（無題）");
    const sum = el("div","sum", c.summary || "");
    const modes = el("div","modes");
    const bn = el("button","n", mode === "normal" ? "✓ 通常記事" : "通常記事"); bn.type = "button"; bn.setAttribute("aria-pressed", String(mode === "normal"));
    const bl = el("button","l", mode === "long" ? "✓ 長文（有料）" : "長文（有料）"); bl.type = "button"; bl.setAttribute("aria-pressed", String(mode === "long"));
    const open = isOpen(current); bn.disabled = !open; bl.disabled = !open;
    bn.addEventListener("click", () => setMode(c.id, "normal"));
    bl.addEventListener("click", () => setMode(c.id, "long"));
    modes.append(bn, bl);
    b.append(mark, meta, title, sum, modes);
    return b;
  }

  function freeCard(){
    const box = el("div","free"); if (free.use) box.dataset.mode = free.mode;
    const h = el("div","title","自由記述（自分でネタを書く）");
    const open = isOpen(current);
    const l1 = el("label",null,"タイトル案（必須）"); const t = el("input"); t.id = "free-title"; t.value = free.title; t.placeholder = "例：エヌビディアCEO辞任を、過去のカリスマ退任と比べる"; t.disabled = !open;
    const l2 = el("label",null,"書いてほしい内容のメモ（切り口・銘柄・比べたい過去の例など）"); const m = el("textarea"); m.id = "free-memo"; m.value = free.memo; m.disabled = !open;
    t.addEventListener("input", () => { free.title = t.value; saveDraft(); updateBar(); });
    m.addEventListener("input", () => { free.memo = m.value; saveDraft(); });
    const modes = el("div","modes");
    const bn = el("button","n", free.use && free.mode === "normal" ? "✓ 通常記事にする" : "通常記事にする"); bn.type = "button"; bn.setAttribute("aria-pressed", String(free.use && free.mode === "normal"));
    const bl = el("button","l", free.use && free.mode === "long" ? "✓ 長文（有料）にする" : "長文（有料）にする"); bl.type = "button"; bl.setAttribute("aria-pressed", String(free.use && free.mode === "long"));
    const bx = el("button",null,"使わない"); bx.type = "button";
    bn.disabled = bl.disabled = bx.disabled = !open;
    function pick(mode){
      const c = counts(); const wasThis = free.use && free.mode === mode;
      if (wasThis) { free.use = false; saveDraft(); render(); return; }
      const nFree = free.use ? (free.mode === "normal" ? 1 : 0) : 0, lFree = free.use ? (free.mode === "long" ? 1 : 0) : 0;
      if (mode === "normal" && c.n - nFree >= MAX_N){ $("msg").textContent = "通常記事は3本までです。"; return; }
      if (mode === "long" && c.l - lFree >= MAX_L){ $("msg").textContent = "長文記事は1日1本までです。"; return; }
      free.use = true; free.mode = mode; $("msg").textContent = ""; saveDraft(); render();
    }
    bn.addEventListener("click", () => pick("normal"));
    bl.addEventListener("click", () => pick("long"));
    bx.addEventListener("click", () => { free.use = false; saveDraft(); render(); });
    modes.append(bn, bl, bx);
    const hint = el("div","hint","タイトルを書いてから「通常」か「長文」を押すと、この枠も1本として数えます。メモはこのページだけに保存され、確定するとClaudeに渡ります。");
    box.append(h, l1, t, l2, m, modes, hint);
    return box;
  }

  function updateBar(){
    const c = counts();
    const cnt = $("count"); cnt.textContent = ""; cnt.append(`通常 ${c.n}/${MAX_N}・`); const l = el("span","l",`長文 ${c.l}/${MAX_L}`); cnt.appendChild(l);
    const freeOk = !free.use || free.title.trim().length > 0;
    $("confirm").disabled = (c.n + c.l === 0) || !freeOk;
    $("confirm").textContent = free.use && !freeOk ? "自由記述のタイトルを入力" : "この内容で確定";
  }

  function render(){
    renderDays(); renderStatus();
    const main = $("main"); main.textContent = "";
    if (!current){
      main.appendChild(el("div","empty","まだ候補がありません。平日の11:50ごろに、その日の候補10本がここに届きます。"));
      $("bar").hidden = true; return;
    }
    const cands = Array.isArray(current.candidates) ? current.candidates : [];
    const topics = cands.filter(c => c.kind !== "stock"), stocks = cands.filter(c => c.kind === "stock");
    if (topics.length){ main.appendChild(el("h2",null,`話題・用語・トリッキー（${topics.length}）`)); const g = el("div","grid"); topics.forEach(c => g.appendChild(card(c))); main.appendChild(g); }
    if (stocks.length){ main.appendChild(el("h2",null,`個別銘柄（${stocks.length}）`)); const g = el("div","grid"); stocks.forEach(c => g.appendChild(card(c))); main.appendChild(g); }
    main.appendChild(el("h2",null,"自由記述（1枠）")); main.appendChild(freeCard());
    const p = picks[current.date];
    if (p){
      const r = el("div","result"); const n = (p.ids || []).length + (p.free && p.free.mode === "normal" ? 1 : 0), l = (p.long ? 1 : 0) + (p.free && p.free.mode === "long" ? 1 : 0);
      r.appendChild(el("strong",null, n + l ? "確定した記事" : "この日は書かない、で確定しています"));
      if (n + l){
        const ul = el("ul");
        const name = (id) => { const c = cands.find(x => x.id === id); return c ? c.title : id; };
        (p.ids || []).forEach(id => { const li = el("li"); li.appendChild(el("span","tag","通常")); li.append(name(id)); ul.appendChild(li); });
        if (p.long){ const li = el("li"); li.appendChild(el("span","tag l","長文")); li.append(name(p.long)); ul.appendChild(li); }
        if (p.free){ const li = el("li"); li.appendChild(el("span", p.free.mode === "long" ? "tag l" : "tag", p.free.mode === "long" ? "長文・自由記述" : "通常・自由記述")); li.append(p.free.title || ""); ul.appendChild(li); }
        r.appendChild(ul);
      }
      main.appendChild(r);
    }
    $("bar").hidden = !isOpen(current);
    updateBar();
  }

  function select(date){
    current = days.find(d => d.date === date) || null;
    const p = current ? picks[current.date] : null;
    sel = p && Array.isArray(p.ids) ? p.ids.slice() : []; longId = p && p.long ? p.long : null;
    free = {use:false, mode:"normal", title:"", memo:""};
    if (current) loadDraft(current.date);
    if (p && p.free){ free = {use:true, mode:p.free.mode || "normal", title:p.free.title || "", memo:p.free.memo || ""}; }
    $("msg").textContent = "";
    if (unsubPick) unsubPick();
    if (current && db){
      unsubPick = db.doc("picks/" + current.date).onSnapshot(s => {
        if (s.exists) picks[current.date] = s.data(); else delete picks[current.date];
        render();
      }, () => {});
    }
    render();
  }

  async function save(clear){
    if (!db || !current || !isOpen(current)) return;
    const btns = [$("confirm"), $("skip")]; btns.forEach(b => b.disabled = true);
    $("msg").textContent = "保存しています…";
    const doc = clear ? {date: current.date, ids: [], long: null, free: null, confirmed_at: new Date().toISOString()}
                      : {date: current.date, ids: sel.slice(), long: longId, free: free.use ? {title: free.title.trim(), memo: free.memo.trim(), mode: free.mode} : null, confirmed_at: new Date().toISOString()};
    try {
      await db.doc("picks/" + current.date).set(doc);
      const c = clear ? {n:0,l:0} : counts();
      $("msg").textContent = clear ? "今日は書かない、で確定しました。" : `通常${c.n}本・長文${c.l}本で確定しました。16:15から書き始めます。締切までは選び直せます。`;
    } catch (e) {
      $("msg").textContent = "保存できませんでした。通信を確認して、もう一度押してください。";
    } finally { btns.forEach(b => b.disabled = false); render(); }
  }
  $("confirm").addEventListener("click", () => save(false));
  $("skip").addEventListener("click", () => { sel = []; longId = null; free.use = false; save(true); });

  async function start(){
    const timer = setTimeout(() => { if (!days.length) { const l = $("loading"); if (l) l.textContent = "候補を読み込めませんでした。ページを開き直してください。"; } }, 10000);
    db = await claude.use("db");
    if (!db){ clearTimeout(timer); $("main").textContent = ""; $("main").appendChild(el("div","empty","このページは、サインインした本人だけが使えます。")); return; }
    db.collection("days").orderBy("date","desc").limit(7).onSnapshot(snap => {
      clearTimeout(timer);
      days = snap.docs.map(d => d.data()).filter(d => d && d.date);
      const keep = current && days.find(d => d.date === current.date);
      select(keep ? keep.date : (days[0] ? days[0].date : null));
    }, () => { clearTimeout(timer); $("main").textContent = ""; $("main").appendChild(el("div","empty","候補を読み込めませんでした。ページを開き直してください。")); });
    setInterval(() => { if (current) render(); }, 60000);
  }
  if (window.claude && claude.use) start();
  else { $("main").textContent = ""; $("main").appendChild(el("div","empty","claude.ai の中で開いてください。")); }
})();
</script>
