<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" font-family="'Meiryo UI','IPAGothic',sans-serif" font-size="12" role="img" aria-label="AI関連の循環取引の構図">
  <defs>
    <marker id="d3-arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E67E22"/>
    </marker>
    <marker id="d3-arr-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/>
    </marker>
    <marker id="d3-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/>
    </marker>
  </defs>

  <!-- ring background -->
  <ellipse cx="230" cy="165" rx="215" ry="145" fill="#EEF2F7" opacity="0.6"/>

  <!-- nodes -->
  <g text-anchor="middle">
    <rect x="150" y="14" width="160" height="46" rx="6" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="230" y="33" fill="#1F3A5F" font-weight="bold">OpenAI等</text>
    <text x="230" y="50" fill="#1F3A5F">AI開発企業</text>

    <rect x="165" y="140" width="130" height="46" rx="6" fill="#1F3A5F"/>
    <text x="230" y="168" fill="#FFFFFF" font-weight="bold" font-size="13">エヌビディア</text>

    <rect x="8" y="256" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="83" y="275" fill="#1F3A5F" font-weight="bold">ネオクラウド</text>
    <text x="83" y="292" font-size="11" fill="#1F3A5F">（GPU貸出業者）</text>

    <rect x="302" y="256" width="150" height="46" rx="6" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="377" y="275" fill="#1F3A5F" font-weight="bold">クラウド大手</text>
    <text x="377" y="292" font-size="11" fill="#1F3A5F">データセンター</text>
  </g>

  <!-- N -> AI : investment -->
  <line x1="230" y1="138" x2="230" y2="63" stroke="#E67E22" stroke-width="2" marker-end="url(#d3-arr-o)"/>
  <text x="238" y="98" font-size="11" fill="#E67E22" font-weight="bold">出資・資金提供</text>

  <!-- AI -> clouds : GPU purchase / compute contracts -->
  <path d="M150,48 Q30,90 50,253" fill="none" stroke="#1F3A5F" stroke-width="1.8" marker-end="url(#d3-arr-n)"/>
  <path d="M310,48 Q430,90 410,253" fill="none" stroke="#1F3A5F" stroke-width="1.8" marker-end="url(#d3-arr-n)"/>
  <text x="62" y="118" font-size="11" fill="#1F3A5F">GPU購入／</text>
  <text x="62" y="132" font-size="11" fill="#1F3A5F">計算資源契約</text>
  <text x="386" y="118" font-size="11" fill="#1F3A5F" text-anchor="end">GPU購入／</text>
  <text x="386" y="132" font-size="11" fill="#1F3A5F" text-anchor="end">計算資源契約</text>

  <!-- clouds -> N : GPU bulk purchase = revenue -->
  <path d="M158,268 Q205,268 212,189" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#d3-arr-g)"/>
  <path d="M302,268 Q255,268 248,189" fill="none" stroke="#2E8B57" stroke-width="2" marker-end="url(#d3-arr-g)"/>
  <text x="230" y="290" text-anchor="middle" font-size="11" fill="#2E8B57" font-weight="bold">GPU大量購入</text>
  <text x="230" y="304" text-anchor="middle" font-size="11" fill="#2E8B57" font-weight="bold">＝売上計上</text>

  <!-- N -> neocloud : investment / backstop -->
  <path d="M164,160 Q100,165 95,252" fill="none" stroke="#E67E22" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#d3-arr-o)"/>
  <text x="104" y="214" font-size="11" fill="#E67E22" font-weight="bold">出資・</text>
  <text x="104" y="228" font-size="11" fill="#E67E22" font-weight="bold">買取保証</text>

  <!-- ring label (right top) -->
  <rect x="470" y="22" width="198" height="104" rx="6" fill="#FFFFFF" stroke="#E67E22" stroke-width="1.8"/>
  <g fill="none" stroke="#E67E22" stroke-width="2">
    <path d="M498,52 A16,16 0 1 1 482,68" marker-end="url(#d3-arr-o)"/>
  </g>
  <text x="526" y="62" fill="#E67E22" font-weight="bold">お金が一周して</text>
  <text x="526" y="80" fill="#E67E22" font-weight="bold">売上に戻る</text>
  <text x="569" y="110" text-anchor="middle" fill="#C0392B" font-weight="bold">＝循環取引の疑念</text>

  <!-- callout -->
  <rect x="470" y="160" width="198" height="142" rx="6" fill="#FBEAEA" stroke="#C0392B" stroke-width="1.8"/>
  <text x="482" y="182" fill="#C0392B" font-weight="bold">11/20 報道</text>
  <text x="482" y="202" font-size="11" fill="#C0392B">米SEC調査の焦点に会計処理</text>
  <text x="482" y="224" font-size="11" fill="#1F3A5F">・地域別売上開示の変更</text>
  <text x="482" y="242" font-size="11" fill="#1F3A5F">・一部取引先の売上の扱い 等</text>
  <text x="482" y="270" font-size="11" fill="#8A94A6">（報道ベース・</text>
  <text x="482" y="286" font-size="11" fill="#8A94A6">　不正は未確定）</text>
</svg>
