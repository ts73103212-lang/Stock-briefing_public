<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" font-family="'Meiryo UI','IPAGothic',sans-serif" font-size="12" role="img" aria-label="空売りの仕組みと損失が青天井になるリスク">
  <defs>
    <marker id="d2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/>
    </marker>
    <marker id="d2-arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Top: normal case (x = 12 + i*170, w = 146) -->
  <g text-anchor="middle">
    <rect x="12" y="10" width="146" height="82" rx="6" fill="#EEF2F7" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="85" y="34" fill="#1F3A5F" font-weight="bold" font-size="13">① 借りる</text>
    <text x="85" y="56" fill="#1F3A5F">証券会社から</text>
    <text x="85" y="73" fill="#1F3A5F">株を借りる</text>

    <rect x="182" y="10" width="146" height="82" rx="6" fill="#EEF2F7" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="255" y="34" fill="#1F3A5F" font-weight="bold" font-size="13">② 高値で売る</text>
    <text x="255" y="56" fill="#1F3A5F">例：1,000円</text>
    <text x="255" y="73" font-size="11" fill="#8A94A6">（先に売る）</text>

    <rect x="352" y="10" width="146" height="82" rx="6" fill="#EEF2F7" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="425" y="34" fill="#1F3A5F" font-weight="bold" font-size="13">③ 安値で買い戻す</text>
    <text x="425" y="56" fill="#1F3A5F">下がった所で</text>
    <text x="425" y="73" fill="#1F3A5F">例：700円</text>

    <rect x="522" y="10" width="146" height="82" rx="6" fill="#E8F5EE" stroke="#2E8B57" stroke-width="1.5"/>
    <text x="595" y="34" fill="#2E8B57" font-weight="bold" font-size="13">④ 株を返す</text>
    <text x="595" y="56" fill="#2E8B57" font-weight="bold">差額300円が利益</text>
    <text x="595" y="73" font-size="11" fill="#2E8B57">（−金利・貸株料）</text>
  </g>
  <g stroke="#1F3A5F" stroke-width="1.6" fill="none" marker-end="url(#d2-arr)">
    <line x1="159" y1="51" x2="180" y2="51"/>
    <line x1="329" y1="51" x2="350" y2="51"/>
    <line x1="499" y1="51" x2="520" y2="51"/>
  </g>

  <!-- divider -->
  <line x1="12" y1="110" x2="668" y2="110" stroke="#8A94A6" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="12" y="132" fill="#C0392B" font-weight="bold" font-size="13">もし上がったら…</text>

  <!-- Bottom: rising price staircase -->
  <g text-anchor="middle">
    <rect x="12" y="176" width="146" height="40" rx="6" fill="#EEF2F7" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="85" y="201" fill="#1F3A5F">② 1,000円で売る</text>

    <rect x="200" y="164" width="110" height="40" rx="6" fill="#FBEAEA" stroke="#C0392B" stroke-width="1.2"/>
    <text x="255" y="182" fill="#C0392B" font-weight="bold">1,500円</text>
    <text x="255" y="197" font-size="11" fill="#C0392B">損失 −500円</text>

    <rect x="352" y="150" width="110" height="40" rx="6" fill="#F5CFCB" stroke="#C0392B" stroke-width="1.2"/>
    <text x="407" y="168" fill="#C0392B" font-weight="bold">2,000円</text>
    <text x="407" y="183" font-size="11" fill="#C0392B">損失 −1,000円</text>

    <rect x="504" y="136" width="164" height="40" rx="6" fill="#C0392B"/>
    <text x="586" y="154" fill="#FFFFFF" font-weight="bold">3,000円…</text>
    <text x="586" y="169" font-size="11" fill="#FFFFFF">損失 −2,000円…</text>
  </g>
  <g stroke="#C0392B" stroke-width="1.6" fill="none" marker-end="url(#d2-arr-r)">
    <line x1="159" y1="192" x2="198" y2="186"/>
    <line x1="311" y1="180" x2="350" y2="173"/>
    <line x1="463" y1="166" x2="502" y2="159"/>
  </g>

  <!-- warning box -->
  <rect x="12" y="234" width="656" height="56" rx="6" fill="#FBEAEA" stroke="#C0392B" stroke-width="1.8"/>
  <text x="340" y="257" text-anchor="middle" fill="#C0392B" font-size="13">株価に上限はない ＝ 損失も<tspan font-weight="bold">青天井</tspan></text>
  <text x="340" y="278" text-anchor="middle" fill="#C0392B" font-size="13" font-weight="bold">⚠ 追証（追加保証金）・強制決済の危険</text>
</svg>
