<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" width="100%" font-family="'Meiryo UI','IPAGothic',sans-serif" font-size="12" role="img" aria-label="インバースETFが下落局面で利益を出す仕組み">
  <defs>
    <marker id="d1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/>
    </marker>
    <marker id="d1-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A94A6"/>
    </marker>
  </defs>

  <!-- 6 step boxes: x = 12 + i*112, w = 96 -->
  <g text-anchor="middle">
    <rect x="12" y="10" width="96" height="104" rx="6" fill="#EEF2F7" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="60" y="30" font-size="11" fill="#8A94A6">①</text>
    <text x="60" y="54" fill="#1F3A5F">投資家が</text>
    <text x="60" y="71" fill="#1F3A5F">ETFを買う</text>
    <text x="60" y="90" font-size="11" fill="#8A94A6">（資金）</text>

    <rect x="124" y="10" width="96" height="104" rx="6" fill="#EEF2F7" stroke="#1F3A5F" stroke-width="1.5"/>
    <text x="172" y="30" font-size="11" fill="#8A94A6">②</text>
    <text x="172" y="54" fill="#1F3A5F">運用会社が</text>
    <text x="172" y="71" fill="#1F3A5F">資金を</text>
    <text x="172" y="88" fill="#1F3A5F">受け取る</text>

    <rect x="236" y="10" width="96" height="104" rx="6" fill="#1F3A5F"/>
    <text x="284" y="30" font-size="11" fill="#C9D3E0">③</text>
    <text x="284" y="50" fill="#FFFFFF" font-weight="bold">先物を</text>
    <text x="284" y="66" fill="#FFFFFF" font-weight="bold">「売り」建て</text>
    <text x="284" y="82" font-size="11" fill="#C9D3E0">（スワップ契約等）</text>
    <text x="284" y="102" font-size="11" fill="#FFFFFF">純資産の−2/−3倍</text>

    <rect x="348" y="10" width="96" height="104" rx="6" fill="#FBEAEA" stroke="#C0392B" stroke-width="1.5"/>
    <text x="396" y="30" font-size="11" fill="#8A94A6">④</text>
    <text x="396" y="58" fill="#C0392B" font-weight="bold">指数が</text>
    <text x="396" y="76" fill="#C0392B" font-weight="bold">下落 ↘</text>

    <rect x="460" y="10" width="96" height="104" rx="6" fill="#E8F5EE" stroke="#2E8B57" stroke-width="1.5"/>
    <text x="508" y="30" font-size="11" fill="#8A94A6">⑤</text>
    <text x="508" y="54" fill="#2E8B57">先物を安く</text>
    <text x="508" y="71" fill="#2E8B57">買い戻す</text>
    <text x="508" y="90" fill="#2E8B57" font-weight="bold">＝差益</text>

    <rect x="572" y="10" width="96" height="104" rx="6" fill="#2E8B57"/>
    <text x="620" y="30" font-size="11" fill="#D5EEDF">⑥</text>
    <text x="620" y="54" fill="#FFFFFF" font-weight="bold">基準価額が</text>
    <text x="620" y="71" fill="#FFFFFF" font-weight="bold">上昇 ↗</text>
    <text x="620" y="90" font-size="11" fill="#FFFFFF">→ 投資家の利益</text>
  </g>

  <!-- arrows between boxes -->
  <g stroke="#1F3A5F" stroke-width="1.6" fill="none" marker-end="url(#d1-arr)">
    <line x1="109" y1="62" x2="122" y2="62"/>
    <line x1="221" y1="62" x2="234" y2="62"/>
    <line x1="333" y1="62" x2="346" y2="62"/>
    <line x1="445" y1="62" x2="458" y2="62"/>
    <line x1="557" y1="62" x2="570" y2="62"/>
  </g>

  <!-- side notes -->
  <g stroke="#8A94A6" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#d1-arr-g)">
    <line x1="284" y1="116" x2="200" y2="142"/>
    <line x1="396" y1="116" x2="480" y2="142"/>
  </g>
  <rect x="12" y="146" width="320" height="48" rx="6" fill="#EEF2F7" stroke="#8A94A6" stroke-width="1"/>
  <text x="172" y="166" text-anchor="middle" fill="#1F3A5F">毎日、前日比の−2倍になるよう建玉を調整</text>
  <text x="172" y="184" text-anchor="middle" fill="#1F3A5F" font-weight="bold">（日次リバランス）</text>

  <rect x="348" y="146" width="320" height="48" rx="6" fill="#FBEAEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="508" y="166" text-anchor="middle" fill="#C0392B" font-weight="bold">相場が上がると逆に損失</text>
  <text x="508" y="184" text-anchor="middle" fill="#C0392B">上昇×2倍のスピードで目減り</text>

  <text x="340" y="218" text-anchor="middle" font-size="11" fill="#8A94A6">例：1357 日経ダブルインバース・1360 日経平均ベア2倍・2249 S&amp;P500ダブルインバース（−2倍）／SOXS（SOX指数 −3倍）</text>
</svg>
