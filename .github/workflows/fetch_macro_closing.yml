name: Fetch Macro Data (Closing)

# 15:37 JST実行（UTC 06:37）
# 大引け15:30から7分後。当日終値が確実に確定していることを想定。
#on:
#  schedule:
#    - cron: '37 6 * * 0-4'  # 月〜金 15:37 JST（UTC 06:37）
#  workflow_dispatch:          # 手動実行ボタン（テスト用）

jobs:
  fetch-macro-closing:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pytz requests tradingview-screener -q

      - name: Run fetch_macro_closing.py
        run: python fetch_macro_closing.py
      
      - name: Update holdings_result.json
        run: python fetch_data.py --holdings-only

      - name: Commit and push macro_result_closing.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_result_closing.json
          git diff --cached --quiet || git commit -m "chore: closing fetch $(date +'%Y-%m-%d %H:%M JST')"
          git push
