name: Fetch Screening Data - Midday

on:
  schedule:
    - cron: '50 2 * * 0-4'    # 月〜金 11:50 JST（UTC 02:50）
  workflow_dispatch:            # 手動実行も可能

jobs:
  fetch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tradingview-screener -q

      - name: Run fetch script
        run: python fetch_data.py

      - name: Commit and push result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screening_result.json holdings_result.json
          git diff --cached --quiet || git commit -m "chore: midday fetch $(date '+%Y-%m-%d %H:%M JST' -d '+9 hours')"
          git push
