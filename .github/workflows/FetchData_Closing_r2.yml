name: Fetch Data - Closing

on:
  schedule:
#    - cron: '25 23 * * 1-5'   # 月〜金 15:25 JSTねらい
  workflow_dispatch:

# concurrency:
#  group: data-update
#  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests tradingview-screener yfinance pytz -q

      - name: Show trigger info
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Workflow ref: ${{ github.workflow_ref }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "JST: $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M:%S JST')"

      - name: Run screening fetch (screening + holdings)
        run: python fetch_data.py --suffix closing

      - name: Run macro fetch (closing)
        run: python fetch_macro_closing.py

      - name: Run stophigh screening
        run: python fetch_stophigh.py        

      - name: Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screening_result_closing.json holdings_result_closing.json \
                  macro_result_closing.json screening_stophigh_closing.json          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: closing fetch $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M JST')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "push retry $i ..."
            sleep 5
          done
